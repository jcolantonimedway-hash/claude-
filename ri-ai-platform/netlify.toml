# Netlify configuration for the RI AI platform.
# When importing this repo into Netlify, set the base directory to
# "ri-ai-platform" so these settings and the app's package.json are used.

[build]
  command = "npm run build"
  publish = ".next"

# Official Next.js runtime — handles SSR, routing, and image optimization.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
